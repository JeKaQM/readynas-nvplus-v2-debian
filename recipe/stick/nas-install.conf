# ReadyNAS NV+ v2 -> Debian 13 installer settings. One NAME=value per line, no spaces around "=".

# yes  = install. ERASES ALL FOUR INTERNAL DISKS. The installer changes this to "done-<time>" when it finishes.
# else = rescue mode: the stick boots, but nothing is changed (status page only).
WIPE_ALL_FOUR_DISKS=yes

# Data array over the four disks: 5 = about 2.7 TB, survives one failed disk
#                                 6 = about 1.8 TB, survives two failed disks
#                                10 = about 1.8 TB, survives one failed disk per mirror pair
DATA_RAID=5

# Network name (lowercase letters, digits, "-") and time zone
HOSTNAME=readynas
TIMEZONE=Europe/London

# auto = write the kernel + boot initrd to NAND if every safety check passes; if a check fails the installer
#        stops BEFORE touching the disks
# no   = never write NAND (the NAS then cannot boot Debian on its own; the agent finishes by hand)
FLASH_NAND=auto
