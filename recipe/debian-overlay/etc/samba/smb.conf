# ReadyNAS NV+ v2 Samba configuration. Manage shares and Samba users in Webmin:
# Servers > Samba Windows File Sharing. Members of the Unix group "nasusers" can use [data].
[global]
   workgroup = WORKGROUP
   server string = ReadyNAS NV+ v2
   server role = standalone server
   server min protocol = SMB2_10
   map to guest = never
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

[data]
   comment = NAS data
   path = /srv/data/share
   valid users = @nasusers
   read only = no
   force group = nasusers
   create mask = 0664
   directory mask = 2775
