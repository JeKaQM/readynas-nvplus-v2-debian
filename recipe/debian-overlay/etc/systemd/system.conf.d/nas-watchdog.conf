[Manager]
# orion_wdt has a ~21 s maximum. Under RAID/memory pressure a daemon-reload
# exceeded 15 s and hard-reset this NAS. Upgrades can reload PID 1 too: keep the
# hardware watchdog disabled. A complete hang now requires manual recovery.
RuntimeWatchdogSec=off
RebootWatchdogSec=off
KExecWatchdogSec=off
